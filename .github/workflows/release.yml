name: release

# Every push to main: test, build all binaries, publish the next patch release.
on:
  push:
    branches: [main]

# One release at a time, so two pushes cannot pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to find the last version

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Next version
        id: version
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          echo "tag=v${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - name: Build
        run: make build-all VERSION=${{ steps.version.outputs.tag }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/trapiche_* \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
